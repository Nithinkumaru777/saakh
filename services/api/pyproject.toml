[project]
name = "saakh-api"
version = "0.1.0"
description = "Saakh: AI-based loan eligibility and risk assessment API (AI for Finance CIA-2, Topic 4)"
authors = [{ name = "NITHIN KUMAR U" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2.7",
  "sqlmodel",
  "pandas",
  "numpy",
  "scikit-learn",
  "xgboost",
  "shap",
  "joblib",
  "python-multipart",
  "python-docx",
]

[dependency-groups]
dev = ["pytest", "hypothesis", "pytest-repeat", "httpx"]

[tool.uv]
package = false
